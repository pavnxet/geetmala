<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Geetmala — पुराने गीतों का सफ़र</title>
<meta name="description" content="Geetmala — आपकी निजी संगीत लाइब्रेरी, बिना दोहराव वाले स्मार्ट शफ़ल के साथ।">
<meta name="theme-color" content="#0d0a08">

<!-- Fonts: Lora for the label/title voice, Sora for the control voice -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230d0a08'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23e8b563' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23e8b563'/%3E%3C/svg%3E">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Ambient backdrop: two soft brass glows, pure CSS, no imagery needed -->
<div class="ambient" aria-hidden="true">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>
  <div class="grain"></div>
</div>

<!-- ============ GATE: password screen ============ -->
<main id="gate" class="gate" aria-live="polite">
  <div class="gate__card">
    <div class="gate__mark">
      <svg viewBox="0 0 64 64" class="gate__disc" aria-hidden="true">
        <circle cx="32" cy="32" r="30" class="disc__body"/>
        <circle cx="32" cy="32" r="30" class="disc__ring"/>
        <circle cx="32" cy="32" r="21" class="disc__groove"/>
        <circle cx="32" cy="32" r="14" class="disc__groove"/>
        <circle cx="32" cy="32" r="7"  class="disc__label"/>
        <circle cx="32" cy="32" r="1.6" class="disc__pin"/>
      </svg>
    </div>
    <p class="gate__eyebrow">एक बार का ताला · प्ले जारी रहेगा</p>
    <h1 class="gate__title">Geetmala</h1>
    <p class="gate__tagline">पुराने रेडियो की तरह — अपने गीत, अपनी बारी।</p>

    <form id="gateForm" class="gate__form" autocomplete="off">
      <label for="gatePassword" class="sr-only">पासवर्ड</label>
      <input
        id="gatePassword"
        type="password"
        class="gate__input"
        placeholder="पासवर्ड दर्ज करें"
        autocomplete="current-password"
        inputmode="text"
        required
      >
      <button type="submit" class="gate__submit">
        <span>अनलॉक करें</span>
        <svg viewBox="0 0 20 20" class="gate__submit-icon" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p id="gateError" class="gate__error" role="alert"></p>
  </div>
</main>

<!-- ============ PLAYER: main app, hidden until unlocked ============ -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar__brand">
      <svg viewBox="0 0 64 64" class="topbar__mark" aria-hidden="true">
        <circle cx="32" cy="32" r="30" class="disc__body"/>
        <circle cx="32" cy="32" r="30" class="disc__ring"/>
        <circle cx="32" cy="32" r="7" class="disc__label"/>
      </svg>
      <div>
        <p class="topbar__title">Geetmala</p>
        <p class="topbar__subtitle" id="libraryStatus">लाइब्रेरी लोड हो रही है…</p>
      </div>
    </div>
    <button id="logoutBtn" class="topbar__logout" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M13 14l4-4-4-4M7 10h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Logout</span>
    </button>
  </header>

  <main class="layout">

    <!-- ---------- NOW PLAYING ---------- -->
    <section class="panel panel--player" aria-label="अभी बज रहा गीत">
      <div class="disc-wrap">
        <svg viewBox="0 0 200 200" class="disc-wrap__svg" id="vinylDisc" aria-hidden="true">
          <circle cx="100" cy="100" r="96" class="disc__body"/>
          <circle cx="100" cy="100" r="96" class="disc__ring"/>
          <circle cx="100" cy="100" r="74" class="disc__groove"/>
          <circle cx="100" cy="100" r="58" class="disc__groove"/>
          <circle cx="100" cy="100" r="42" class="disc__groove"/>
          <circle cx="100" cy="100" r="26" class="disc__label"/>
          <text x="100" y="104" id="discInitial" class="disc__initial" text-anchor="middle">G</text>
          <circle cx="100" cy="100" r="3.4" class="disc__pin"/>
        </svg>
        <div class="tonearm" id="tonearm" aria-hidden="true"></div>
      </div>

      <div class="track-meta">
        <p class="track-meta__eyebrow" id="trackYearAlbum">—</p>
        <h2 class="track-meta__title" id="trackTitle">कोई गीत नहीं चुना गया</h2>
        <p class="track-meta__artist" id="trackArtist">Geetmala से एक गीत चुनें</p>
      </div>

      <div class="seek">
        <input type="range" id="seekbar" class="seek__range" min="0" max="100" value="0" step="0.1"
               aria-label="गीत में स्थिति">
        <div class="seek__times">
          <span id="timeCurrent">00:00</span>
          <span id="timeDuration">00:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="shuffleBtn" class="ctrl ctrl--toggle" type="button" title="स्मार्ट शफ़ल (S)" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h3l7 10h4M3 15h3l2.2-3.1M14 5h3M17 5l-2.5-2.5M17 5l-2.5 2.5M17 15l-2.5 2.5M17 15l-2.5-2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="prevBtn" class="ctrl" type="button" title="पिछला गीत">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4v12M16 5 8 10l8 5V5Z" fill="currentColor"/></svg>
        </button>
        <button id="rewindBtn" class="ctrl" type="button" title="10 सेकंड पीछे (←)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 1 2 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M4 6v4h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="10" y="13.5" class="ctrl__tiny">10</text></svg>
        </button>
        <button id="playBtn" class="ctrl ctrl--play" type="button" title="Play / Pause (Space)">
          <svg viewBox="0 0 20 20" id="iconPlay" aria-hidden="true"><path d="M6 4.5v11l9-5.5-9-5.5Z" fill="currentColor"/></svg>
          <svg viewBox="0 0 20 20" id="iconPause" class="hidden" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="11.6" y="4" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="forwardBtn" class="ctrl" type="button" title="10 सेकंड आगे (→)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 0-2 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M16 6v4h-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="6.2" y="13.5" class="ctrl__tiny">10</text></svg>
        </button>
        <button id="nextBtn" class="ctrl" type="button" title="अगला गीत">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 4v12M4 5l8 5-8 5V5Z" fill="currentColor"/></svg>
        </button>
        <button id="repeatBtn" class="ctrl ctrl--toggle" type="button" title="दोहराव मोड (R)" aria-pressed="false" data-mode="off">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a4 4 0 0 1 4-4h6M14 4l-2.2 2.2M14 4l-2.2-2.2M16 12a4 4 0 0 1-4 4H6M6 16l2.2-2.2M6 16l2.2 2.2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="repeatOneDot" class="repeat-dot hidden">1</span>
        </button>
      </div>

      <div class="controls-row2">
        <div class="volume">
          <button id="muteBtn" class="ctrl ctrl--flat" type="button" title="म्यूट (M)">
            <svg viewBox="0 0 20 20" id="iconVolUp" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8H3Z" fill="currentColor"/><path d="M13 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 20 20" id="iconVolMute" class="hidden" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8H3Z" fill="currentColor"/><path d="m13 7 4 6M17 7l-4 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input type="range" id="volumeSlider" class="volume__range" min="0" max="1" step="0.01" value="0.8" aria-label="वॉल्यूम">
        </div>
        <label class="speed">
          <span>गति</span>
          <select id="speedSelect" aria-label="प्लेबैक स्पीड">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>

      <p class="queue-status" id="queueStatus">0 / 0 गीत सुने गए</p>
    </section>

    <!-- ---------- PLAYLIST ---------- -->
    <section class="panel panel--list" aria-label="गीत सूची">
      <div class="list-head">
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="search" id="searchInput" placeholder="गीत, गायक या एल्बम खोजें…" aria-label="गीत खोजें">
        </div>
        <span class="list-count" id="listCount">0 गीत</span>
      </div>
      <div class="list-scroll" id="listScroll">
        <div class="list-rows" id="listRows" role="list"></div>
        <p class="list-empty hidden" id="listEmpty">कुछ नहीं मिला। दूसरा शब्द आज़माएं।</p>
        <div class="list-sentinel" id="listSentinel" aria-hidden="true"></div>
      </div>
    </section>

  </main>
</div>

<!-- Toast host -->
<div id="toastHost" class="toast-host" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
